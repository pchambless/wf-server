project: wf-server
description: Clean-slate Express app serving HTMX pages via n8n webhooks

agent_tooling:
  path: /home/paul/Projects/wf-agents
  scripts: /home/paul/Projects/wf-agents/agents/tools
  # Run this first, every session. Arg 1 is the app id, arg 2 is your role —
  # pass 'kiro' to get your own contract from guidance.contracts, not just the
  # shared one — and arg 3 is the project scope, which keeps local-desk and
  # wf-marketing rules out of a whatsfresh session.
  # Do not pipe to jq: output is section headers plus JSON blocks.
  session_startup: bash /home/paul/Projects/wf-agents/agents/tools/plan/session-startup 58 kiro whatsfresh

# Your operating contract lives in guidance.contracts (localhost), role 'kiro'.
# It renders at the top of session_startup. Read it directly with:
#   bash /home/paul/Projects/wf-agents/agents/tools/investigate/local-text \
#     "SELECT body FROM guidance.contracts WHERE role IN ('all','kiro')"

frequent_paths:
  entry_point: src/server.js
  app_init: src/app.js
  n8n_client: src/utils/n8nClient.js
  routes: src/routes/
  controllers: src/controllers/
  renderers: src/renderers/
  env: .env

established_patterns:
  data_access: All DB access via n8nClient.js — never direct DB connections
  modules: ESM only (import/export)
  responses: HTMX HTML fragments from controllers
  dd_widgets: callWorkflow('dd-query', { query, params, source:'server' })
  reports: callWorkflow('wf-report', { report, params })
  no_comments: No code comments unless explicitly requested

n8n:
  base_url: https://n8n.whatsfresh.app
  key_workflows:
    dd_query: POST /webhook/dd-query
    wf_report: POST /webhook/wf-report
    server_query: POST /webhook/server-query

# build_status and active_sprint were removed 2026-07-27: both had gone stale
# (n8nClient/routes/controller listed as pending though built; epic 91 / plan 99
# long superseded). session_startup renders live sprint state — do not
# reintroduce a hardcoded copy here.
