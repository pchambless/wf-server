# n8n on the dev and prod droplets (task 543). One file for both hosts; everything that differs per host
# or is secret lives OUTSIDE git, on the host:
#   /home/n8n/n8n-compose/.env   N8N_VERSION=<tag>        (read by compose for the ${...} below; the only thing an
#                                                          upgrade changes - written by n8n-upgrade.sh)
#   /home/n8n/n8n.env            host-specific + secret values, mode 600, generated by make-host-env.sh from the
#                                running container: N8N_HOST, N8N_EDITOR_BASE_URL, WEBHOOK_URL, DB_POSTGRESDB_PASSWORD
# The N8N_ENCRYPTION_KEY is in the data volume (/home/n8n/n8n_data/.n8n/config), not in any env file.
#
# Shape = what `docker run` in scripts/production/upgrade-n8n.sh / provision.sh section 8 produced: host network,
# bind-mounted data dir (must be owned by uid 1000 - Guide 28 rule 2), restart unless-stopped.
#
# NEVER recreate this container through a webhook hosted by this same n8n (Guide 28 rule 1).
services:
  n8n:
    image: n8nio/n8n:${N8N_VERSION:?N8N_VERSION is not set - see /home/n8n/n8n-compose/.env}
    container_name: n8n
    restart: unless-stopped
    network_mode: host
    env_file:
      - /home/n8n/n8n.env
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: 127.0.0.1
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: wf_admin
      N8N_PORT: "5678"
      N8N_PROTOCOL: https
      N8N_TRUST_PROXY: "true"
      N8N_PROXY_HOPS: "1"
      N8N_SECURE_COOKIE: "false"
      N8N_PUSH_BACKEND: sse
      N8N_ALLOWED_PUSH_ORIGINS: "*"
      N8N_USER_FOLDER: /data
      N8N_LOG_LEVEL: warn
      N8N_LOG_OUTPUT: console,file
      N8N_LOG_FILE_LOCATION: /data/logs/n8n.log
      N8N_LOG_FILE_MAX_SIZE: "10"
      N8N_LOG_FILE_MAX_COUNT: "3"
      N8N_ENABLE_COMMANDS: "true"
      N8N_COMMUNITY_PACKAGES_ALLOW_TOOL_USAGE: "true"
      TZ: America/Chicago
    volumes:
      - /home/n8n/n8n_data:/data
    # What the upgrade tool waits on. start_period covers the DB migrations of a new version.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
